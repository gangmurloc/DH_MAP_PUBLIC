# 수동 실행(Actions → Vercel 배포 → Run workflow)하면 앱을 빌드해 Vercel 프로덕션에 배포한다.
# 쓰려면 저장소 Secrets에 VERCEL_TOKEN·VERCEL_ORG_ID·VERCEL_PROJECT_ID를 넣는다 (공개판은 자동 배포를 끔).
name: Vercel 배포

on:
  workflow_dispatch:

# 연달아 커밋되면 마지막 것만 배포
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: 배포 작업 폴더 준비
        shell: bash
        run: |
          deploy_dir="$RUNNER_TEMP/vercel-deploy"
          mkdir -p "$deploy_dir"
          # 배포 환경 변수와 프로젝트 연결 정보는 다음 단계에서 Vercel에서 받는다.
          git archive HEAD app | tar --exclude='app/.env*' --exclude='app/.vercel' -xf - -C "$deploy_dir"
      # 프로젝트 설정(루트 폴더 app, Vite)과 프로덕션 환경변수를 Vercel에서 가져온다
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        working-directory: ${{ runner.temp }}/vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        working-directory: ${{ runner.temp }}/vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Vercel 프로덕션 배포
        working-directory: ${{ runner.temp }}/vercel-deploy
        run: |
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --meta "sourceCommitSha=$GITHUB_SHA" \
            --meta "actionsRunUrl=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
