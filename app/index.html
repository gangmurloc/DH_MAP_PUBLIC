<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="color-scheme" content="light" />
    <!-- 메인·관리자 페이지는 저장된 테마나 기기 설정과 관계없이 라이트 모드로 표시한다. -->
    <script>
      (function () {
        document.documentElement.classList.remove('dark')
        document.documentElement.style.colorScheme = 'light'
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', '#fafaf9')
      })()
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 본문: Pretendard 하나 (한글·영문·숫자가 같은 결). 화면에 쓰인 글자 조각만 내려받는 동적 서브셋 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <!-- 제목·큰 숫자: Wanted Sans (700). 글자 범위별로 나눈 파일이라 쓰인 조각만 내려받는다 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" />
    <meta name="description" content="조사단이 직접 걷고 잰 동해시 보행 접근성 지도" />
    <title>경사났네</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
